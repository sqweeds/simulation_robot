collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"   #se der errado trocar pra raw
    cmd_vel_out_topic: "cmd_vel_safe"   #se der errado tirar o safe
    #collision_monitor_state_topic: "collision_monitor_state"        
    transform_tolerance: 0.5
    source_timeout: 1.0                 
    base_shift_correction: True
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: [0.30, 0.22, 0.30, -0.22, 0.0, -0.22, 0.0, 0.22]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"


    PolygonSlow:
      type: "polygon"
      points: [0.50, 0.28, 0.50, -0.28, 0.0, -0.28, 0.0, 0.28]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5                  
      visualize: True
      polygon_pub_topic: "polygon_slowdown"

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True                       